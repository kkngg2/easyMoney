<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>easyMoney - Spending Limit</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <section id="navbar">
      <div class="logo">easyMoney</div>
      <ul>
        <li><a href="index.html">My Wallet</a></li>
        <li><a href="add.html">Add Transaction</a></li>
        <li><a class="active" href="limit.html">Spending Limit</a></li>
        <li><a href="goals.html">Goals</a></li>
        <li><a href="tips.html">Tips</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
  </section>

  <main class="main-content">
   <header class="section-header">
            <div>
                <h1>Spending Limit</h1>
                <p class="h3">October 2026</p>
            </div>
            <button id="openModalBtn" class="btn-primary">Set Limits</button>
        </header>

        <section class="group-card">
            <div class="group-header">
                <h3 class="group-title">Total Monthly Limit</h3>
            </div>
            
            <h2 id="displayTotalLimit">0 ₫</h2>

            <div>
                <span>Spent: <span id="displayTotalSpent">0 ₫</span></span>
                <span id="displayTotalPercent">0%</span>
            </div>

            <div class="progress-container">
                <div id="totalProgressBar" class="progress-bar"></div>
            </div>

            <div>
                Remaining: <span id="displayTotalRemaining">0 ₫</span>
            </div>
        </section>

        <section class="group-card">
            <div class="group-header">
                <h3 class="group-title">Category Limits</h3>
            </div>
            
            <div id="categoryContainer" class="sub-wallet-list"></div>
        </section>

    </main>

    <div id="limitModal" class="modal">
        <div class="modal-content">
            <div class="group-header">
                <h3>Set Monthly Limits</h3>
                <button id="closeModalBtn" class="btn-icon">&times;</button>
            </div>

            <form id="limitForm">
                <div class="form-group">
                    <label for="inputTotalLimit">TOTAL LIMIT (VND)</label>
                    <input type="number" id="inputTotalLimit" required>
                </div>

                <div class="form-group">
                    <label style="margin-bottom: 8px;">CATEGORY LIMITS</label>
                    <div id="modalCategoryInputs"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
  </main>
  <script src="limit.js"></script>
</body>
</html>
